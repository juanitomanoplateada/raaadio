name: Compilación y pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (Release)
    # Imagen fija con Visual Studio 2022: windows-latest cambia de imagen cuando GitHub la
    # actualiza y la nueva ya no trae VS 2022 (el generador de abajo no lo encontraba).
    # JUCE 8.0.3 se compila y se prueba con VS 2022.
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # JUCE, SQLite, libebur128, LAME y Chromaprint se descargan con FetchContent: se guardan
      # entre corridas.
      - name: Caché de dependencias
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configurar
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Pruebas
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Publicar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: RAAADIO-windows-x64
          path: |
            build/RAAADIO_artefacts/Release/RAAADIO.exe
            build/RAAADIO_artefacts/Release/libmp3lame.dll
            build/RAAADIO_artefacts/Release/libmp3lame-COPYING.txt
            build/RAAADIO_artefacts/Release/chromaprint.dll
            build/RAAADIO_artefacts/Release/chromaprint-LICENSE.md
          if-no-files-found: error
