# SonarQube: análisis de calidad de RAAADIO.
#
# Se ejecuta con tools/sonar-scan.ps1, que prepara el informe de clang-tidy y llama a
# sonar-scanner. El token NO va en este archivo: el script lo toma de la variable de entorno
# SONAR_TOKEN o del archivo local .sonar-token (ignorado por git).

sonar.host.url=http://localhost:9000
sonar.projectKey=raaadio
sonar.projectName=RAAADIO
sonar.sourceEncoding=UTF-8

sonar.sources=Source
sonar.tests=Tests

# Carpeta de trabajo del escáner dentro de build-sonar/ (ignorada por git), no en la raíz.
sonar.working.directory=build-sonar/scannerwork

# ── C++ ──────────────────────────────────────────────────────────────────────────────────
# SonarQube Community no trae analizador de C/C++: el servidor necesita el plugin comunitario
# sonar-cxx (https://github.com/SonarOpenCommunity/sonar-cxx). Da líneas de código,
# complejidad, comentarios y duplicados. Los hallazgos llegan de clang-tidy como issues
# externos (tools/sonar-scan.ps1 los pasa con sonar.externalIssuesReportPaths), así que no
# hace falta activar reglas en el perfil de calidad del servidor.
sonar.cxx.file.suffixes=.cpp,.h

# El parser de sonar-cxx no lee los encabezados de JUCE: sin estas macros (que van al final de
# las clases, sin punto y coma) descarta la clase entera y las métricas salen mal. Se compila
# para Windows, así que las ramas #if JUCE_WINDOWS son las que cuentan.
sonar.cxx.defines=JUCE_DECLARE_NON_COPYABLE_WITH_LEAK_DETECTOR(className) \n\
                  JUCE_DECLARE_NON_COPYABLE(className) \n\
                  JUCE_LEAK_DETECTOR(className) \n\
                  START_JUCE_APPLICATION(appClass) \n\
                  JUCE_WINDOWS 1 \n\
                  JUCE_MSVC 1 \n\
                  JUCE_MAC 0 \n\
                  JUCE_IOS 0 \n\
                  JUCE_ANDROID 0
